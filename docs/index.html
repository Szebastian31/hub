<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<meta name="description" content="Seven apps for looking ahead: Hora, Consensus Weather, Augur, Annales, Kalendae, Caelum and Fidelis, one tap away.">
<meta name="theme-color" content="#4A4F92">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- The same screen as the Android app (MainActivity.java): the purple-to-peach sky, frosted rows, Noto Serif.
     On the web every row opens that app's web version, in a new tab, or in Safari from the Home Screen. -->
<style>
  @font-face { font-family: Hub; font-weight: 400; font-display: swap; src: url(fonts/NotoSerif-Regular.ttf) format('truetype'); }
  @font-face { font-family: Hub; font-weight: 600; font-display: swap; src: url(fonts/NotoSerif-SemiBold.ttf) format('truetype'); }
  @font-face { font-family: Hub; font-style: italic; font-display: swap; src: url(fonts/NotoSerif-Italic.ttf) format('truetype'); }
  :root { --blue: #2F3FA8; --ink: #2A2A38; --muted: #8C889A; --label: rgba(236,234,246,.8); --title: #F4F2FB; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { min-height: 100%; background: #4A4F92; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; font-family: Hub, "Noto Serif", Georgia, serif; -webkit-font-smoothing: antialiased; color: var(--title); }
  #sky { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 46px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: .18em; color: var(--label); }
  .kicker { font-size: 11px; padding: 0 0 6px 4px; }
  h1 { margin: 0; padding: 0 0 18px 4px; font-size: 27px; line-height: 1.12; font-weight: 400; }
  a.row { display: flex; align-items: center; gap: 13px; margin-bottom: 11px; padding: 12px 16px; border-radius: 20px; text-decoration: none;
    background: linear-gradient(90deg, rgba(255,255,255,.8), rgba(255,255,255,.4)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: transform .15s, background .2s; }
  a.row:active { transform: scale(.98); background: linear-gradient(90deg, rgba(255,255,255,.7), rgba(225,228,255,.45)); }
  .ico { width: 52px; height: 52px; flex: none; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .ico img { width: 100%; height: 100%; display: block; }
  .ico.letter { border-radius: 50%; box-shadow: inset 0 0 0 2px var(--muted); color: var(--muted); font-size: 24px; }
  .txt { flex: 1; min-width: 0; }
  .name { color: var(--ink); font-size: 18px; line-height: 1.3; font-weight: 600; }
  .cat { color: var(--blue); font-size: 13px; font-style: italic; line-height: 1.35; }
  .chev { color: var(--blue); font-size: 26px; line-height: 1; padding: 0 0 2px 8px; }
  .foot { font-size: 10px; text-align: center; padding-top: 12px; }
  .add { margin: 18px 4px 0; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: var(--label); text-align: center; }
  .add:empty { display: none; }
  .add b { color: var(--title); }
  @media (hover: hover) { a.row:hover { background: linear-gradient(90deg, rgba(255,255,255,.88), rgba(255,255,255,.5)); } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="kicker mono" id="kicker">HUB · 07 APPS</div>
  <h1>Seven apps for<br>looking ahead.</h1>
  <div id="list"></div>
  <div class="foot mono">MADE TO BE LOOKED UP AT</div>
  <p class="add" id="add"></p>
</main>
<script>
'use strict';
// name, category, web address, icon (copied in from each app's own repo; a letter in a circle if it's missing)
const APPS = [
  ['Hora', 'Clock', 'https://szebastian31.github.io/hora/', 'hora'],
  ['Consensus', 'Weather', 'https://szebastian31.github.io/Consensus_Weather/', 'consensus'],
  ['Augur', 'Fate', 'https://szebastian31.github.io/augur/', 'augur'],
  ['Annales', 'Journal', 'https://szebastian31.github.io/annales/', 'annales'],
  ['Kalendae', 'Budgeting', 'https://szebastian31.github.io/kalendae/', 'kalendae'],
  ['Caelum', 'Sky', 'https://szebastian31.github.io/caelum/', 'caelum'],
  ['Fidelis', 'Music', 'https://szebastian31.github.io/fidelis/', 'fidelis'],
];

document.getElementById('kicker').textContent = `HUB · ${String(APPS.length).padStart(2, '0')} APPS`;
const list = document.getElementById('list');
for (const [name, cat, url, icon] of APPS) {
  const a = document.createElement('a');
  a.className = 'row'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.setAttribute('aria-label', `${name}, ${cat}`);
  const ico = document.createElement('div');
  ico.className = 'ico';
  const img = new Image();
  img.alt = ''; img.src = `icons/${icon}.png`;
  img.onerror = () => { ico.className = 'ico letter'; ico.replaceChildren(name[0]); };
  ico.append(img);
  a.append(ico);
  a.insertAdjacentHTML('beforeend', `<div class="txt"><div class="name">${name}</div><div class="cat">${cat}</div></div><div class="chev" aria-hidden="true">›</div>`);
  a.addEventListener('click', () => { if (navigator.vibrate) navigator.vibrate(8); });
  list.append(a);
}

// a short how-to on iPhone, until Hub is on the Home Screen
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (!standalone && ios && !location.search.includes('shot')) {
  document.getElementById('add').innerHTML = 'Keep Hub on your iPhone: tap <b>Share</b>, then <b>Add to Home Screen</b>.';
}

// purple-blue to peach, with faint star dots and two thin orbit lines, like the Android app
const cv = document.getElementById('sky'), g = cv.getContext('2d');
function sky() {
  const dpr = devicePixelRatio || 1, w = innerWidth, h = Math.max(innerHeight, document.documentElement.clientHeight);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fill = g.createLinearGradient(0, 0, 0, h); fill.addColorStop(0, '#4A4F92'); fill.addColorStop(1, '#A4634A');
  g.fillStyle = fill; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1;
  const oval = (l, t, r, b) => { g.beginPath(); g.ellipse((l + r) / 2, (t + b) / 2, (r - l) / 2, (b - t) / 2, 0, 0, Math.PI * 2); g.stroke(); };
  oval(-w * .4, h * .05, w * 1.3, h * .55); oval(-w * .2, h * .45, w * 1.5, h * 1.1);
  let s = 31; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; // fixed seed, so the stars don't move
  g.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 0; i < 60; i++) { g.beginPath(); g.arc(rnd() * w, rnd() * h, .5 + rnd(), 0, Math.PI * 2); g.fill(); }
}
sky(); addEventListener('resize', sky);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
