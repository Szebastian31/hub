name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # the first run makes a signing key and commits it, so every later APK installs over the old one
      - name: Create signing key (first run only)
        run: |
          if [ ! -f keystore/hub.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/hub.keystore -storepass hub-apps -keypass hub-apps \
              -alias hub -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hub"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/hub.keystore
            git commit -m "Add the signing key [skip ci]"
            git push
          fi

      # the version, release name and APK file name all come from versionName in app/build.gradle
      - name: Read version
        id: ver
        run: echo "name=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Hub_v${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hub-v${{ steps.ver.outputs.name }}-apk
          path: Hub_v${{ steps.ver.outputs.name }}.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Hub v${{ steps.ver.outputs.name }}
          files: Hub_v${{ steps.ver.outputs.name }}.apk
          make_latest: true
          body: |
            Download **Hub_v${{ steps.ver.outputs.name }}.apk** below and open it on your phone to install.

            One screen with Hora, Kalendae, Consensus Weather, Augur and Caelum. Tap a tile to open that app.
