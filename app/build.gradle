plugins {
    id 'com.android.application'
}

android {
    namespace 'com.szebastian.hub'
    compileSdk 34

    defaultConfig {
        applicationId "com.szebastian.hub"
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName "1.6.0"
    }


    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The family signing key never lives in git. GitHub builds get it from the FAMILY_* secrets,
// local builds from ~/.gradle/gradle.properties.
def familyProp = { String k -> System.getenv(k) ?: project.findProperty(k) }
def familyKeystore = {
    def path = familyProp("FAMILY_KEYSTORE_PATH")
    if (path) return file(path)
    def b64 = System.getenv("FAMILY_KEYSTORE_B64")
    if (!b64) return null
    def f = new File(System.getProperty("java.io.tmpdir"), "family-${rootProject.name}.jks")
    f.bytes = Base64.mimeDecoder.decode(b64)
    return f
}()

android {
    signingConfigs {
        family {
            if (familyKeystore) {
                storeFile familyKeystore
                storePassword familyProp("FAMILY_KEYSTORE_PASSWORD")
                keyAlias familyProp("FAMILY_KEY_ALIAS")
                keyPassword familyProp("FAMILY_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.family }
        release { signingConfig signingConfigs.family }
    }
}
